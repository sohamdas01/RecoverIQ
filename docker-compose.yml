services:
  # ============================================================================
  # 1. Core Data & Infrastructure Layer
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: recoveriq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recoveriq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recoveriq_password}
      POSTGRES_DB: ${POSTGRES_DB:-recoveriq_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recoveriq_user} -d ${POSTGRES_DB:-recoveriq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - recoveriq-network

  redis:
    image: redis:7-alpine
    container_name: recoveriq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - recoveriq-network

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: recoveriq-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp | grep -q :18BD || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - recoveriq-network

  minio:
    image: minio/minio:latest
    container_name: recoveriq-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - recoveriq-network

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: recoveriq-redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "19092:19092"
      - "9092:9092"
      - "8082:8082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recoveriq-network

  # ============================================================================
  # 2. Internal Microservices (Inference & Autonomous Multi-Agents)
  # ============================================================================
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: recoveriq-ml-service
    restart: unless-stopped
    environment:
      PORT: 8000
      ENVIRONMENT: production
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:-recoveriq-internal-service-token-dev-secret}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-recoveriq-internal-service-token-dev-secret}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - recoveriq-network

  genai-service:
    build:
      context: ./genai-service
      dockerfile: Dockerfile
    container_name: recoveriq-genai-service
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      PORT: 8001
      ENVIRONMENT: production
      GENAI_INTERNAL_TOKEN: ${GENAI_INTERNAL_TOKEN:-recoveriq-internal-service-token-dev-secret}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-recoveriq-internal-service-token-dev-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      QDRANT_URL: http://qdrant:6333
      BACKEND_URL: http://backend:4000
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - recoveriq-network

  # ============================================================================
  # 3. Backend API, Policy Guardrails & Kafka Event Workers
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recoveriq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
      ml-service:
        condition: service_healthy
      genai-service:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-recoveriq_user}:${POSTGRES_PASSWORD:-recoveriq_password}@postgres:5432/${POSTGRES_DB:-recoveriq_db}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: recoveriq-backend
      ML_SERVICE_URL: http://ml-service:8000
      GENAI_SERVICE_URL: http://genai-service:8001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-recoveriq-super-secret-jwt-key-change-in-production}
      RECOVERY_LINK_SECRET: ${RECOVERY_LINK_SECRET:-recoveriq-recovery-link-signing-secret}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-recoveriq-internal-service-token-dev-secret}
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:-recoveriq-internal-service-token-dev-secret}
      GENAI_INTERNAL_TOKEN: ${GENAI_INTERNAL_TOKEN:-recoveriq-internal-service-token-dev-secret}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder_key}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_placeholder_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-rzp_webhook_secret_placeholder}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - recoveriq-network

  # ============================================================================
  # 4. Frontend Dashboard & Customer Recovery Portal
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000/api}
    container_name: recoveriq-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000/api}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - recoveriq-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  redpanda_data:

networks:
  recoveriq-network:
    driver: bridge
